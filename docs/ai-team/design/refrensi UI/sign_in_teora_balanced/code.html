</div>
<div class="relative mb-xs">
<label class="sr-only" for="password">Password</label>
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">lock</span>
</div>

</div>
<div class="flex items-center justify-between mb-sm px-base">

</label>

</div>
