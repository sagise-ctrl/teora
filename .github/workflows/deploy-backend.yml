name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Check API server changes
        id: filter
        run: |
          if git diff --name-only HEAD~1 | grep -qE "^(artifacts/api-server|lib/db)/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup workspace packages
        run: node ./artifacts/api-server/setup-workspace.mjs

      - name: Build API server
        run: npm -w @workspace/api-server run build

      - name: Prepare deployment artifact
        run: |
          # Remove workspace file: refs from package.json — deps already bundled
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('artifacts/api-server/package.json', 'utf8'));
            delete pkg.dependencies['@workspace/api-zod'];
            delete pkg.dependencies['@workspace/db'];
            fs.writeFileSync('artifacts/api-server/package.json', JSON.stringify(pkg, null, 2));
          "
          # Copy production node_modules
          mkdir -p artifacts/api-server/node_modules
          for dep in zod drizzle-orm drizzle-zod pg cookie-parser cors express express-rate-limit jose nanoid pino pino-http pino-pretty thread-stream docx @supabase/supabase-js @citation-js/core @citation-js/plugin-doi @citation-js/plugin-isbn @vercel/node; do
            cp -r "node_modules/$dep" artifacts/api-server/node_modules/ 2>/dev/null || true
          done
          # Copy bundled workspace packages
          cp -r artifacts/api-server/.bundled/@workspace artifacts/api-server/node_modules/ 2>/dev/null || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-server-dist
          path: |
            artifacts/api-server/api
            artifacts/api-server/dist
            artifacts/api-server/.bundled
            artifacts/api-server/vercel.json
            artifacts/api-server/package.json
            artifacts/api-server/node_modules
          retention-days: 1

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://api.teora.com
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: api-server-dist
          path: artifacts/api-server

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (prebuilt)
        run: |
          # Override vercel.json to skip build/install (already done in CI)
          echo '{"framework":null,"installCommand":"echo skipping","buildCommand":"echo skipping"}' > artifacts/api-server/vercel.json
          vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --project=api-server \
            --yes \
            --cwd=artifacts/api-server

      - name: Health check
        run: |
          sleep 5
          curl -sf --retry 5 --retry-delay 5 \
            --retry-connrefused \
            https://api.teora.com/api/healthz \
            || echo "Warning: Health check failed — verify manually in Vercel dashboard"
