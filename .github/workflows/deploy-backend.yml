name: Deploy Backend
# Builds and deploys api-server to Vercel on code changes
on:
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm install --legacy-peer-deps 2>&1 | tail -5

      - name: Setup workspace packages
        working-directory: artifacts/api-server
        run: node ./setup-workspace.mjs

      - name: Build API server
        working-directory: artifacts/api-server
        run: |
          echo "=== .bundled/ check ==="
          ls .bundled/@workspace/ 2>&1 || echo "NO .bundled/"
          echo "=== Testing esbuild WITHOUT workspace plugin ==="
          node -e "
            import('esbuild').then(async ({build})=>{
              try {
                await build({
                  entryPoints:['api/_handler.ts'],
                  platform:'node',
                  bundle:true,
                  format:'esm',
                  outdir:'api',
                  outExtension:{'*.js':'.mjs'},
                  logLevel:'info',
                  external:['@vercel/node','*.node','pg','zod','drizzle-orm','drizzle-zod'],
                });
                console.log('esbuild OK');
              } catch(e) {
                console.error('esbuild FAIL:', e.message);
              }
            });
          " 2>&1 | head -20
          echo "=== Running full build ==="
          node ./build.mjs 2>&1

      - name: Prepare deployment package
        run: |
          # Remove workspace file: refs — deps already bundled
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('artifacts/api-server/package.json', 'utf8'));
            delete pkg.dependencies['@workspace/api-zod'];
            delete pkg.dependencies['@workspace/db'];
            fs.writeFileSync('artifacts/api-server/package.json', JSON.stringify(pkg, null, 2));
          "
          # node_modules: production runtime deps
          mkdir -p artifacts/api-server/node_modules
          for dep in \
            zod drizzle-orm drizzle-zod pg \
            cookie-parser cors express express-rate-limit \
            jose nanoid pino pino-http pino-pretty \
            thread-stream docx \
            @supabase/supabase-js \
            @citation-js/core @citation-js/plugin-doi @citation-js/plugin-isbn \
            @vercel/node; do
            cp -r "node_modules/$dep" artifacts/api-server/node_modules/ 2>/dev/null || true
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-server-dist
          path: |
            artifacts/api-server/api
            artifacts/api-server/dist
            artifacts/api-server/node_modules
            artifacts/api-server/package.json
          retention-days: 1

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://api-server-mocha-eight.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: api-server-dist
          path: artifacts/api-server

      - name: Deploy to Vercel
        run: |
          npm install -g vercel
          # Skip Vercel's build — artifact already built. Override vercel.json in the artifact dir.
          echo '{"framework":null,"installCommand":":","buildCommand":":"}' > artifacts/api-server/vercel.json
          vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --project-id=prj_5PlXdG6841wXuah11uY8CdgMNmsn \
            --yes \
            --cwd=artifacts/api-server

      - name: Health check
        run: |
          sleep 5
          curl -sf --retry 5 --retry-delay 5 \
            --retry-connrefused \
            https://api-server-mocha-eight.vercel.app/api/healthz \
            || echo "Warning: Health check failed — verify manually in Vercel dashboard"
