name: Deploy Backend
# Builds and deploys api-server to Vercel on code changes
on:
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm install --legacy-peer-deps 2>&1 | tail -5

      - name: Verify workspace packages
        run: |
          echo "Repo root: $(pwd)"
          echo "Workspace symlinks:"
          ls -la node_modules/@workspace/ 2>&1 || echo "NO @workspace SYMLINKS!"
          echo "@workspace/db:"
          ls -la node_modules/@workspace/db 2>&1 | head -5 || echo "NOT FOUND"

      - name: Build API server
        run: |
          echo "Build working directory: $(pwd)"
          export NODE_PATH="$(pwd)/node_modules"
          ls -la artifacts/api-server/ 2>&1 | head -5
          ls -la artifacts/api-server/*.mjs 2>&1 || echo "No .mjs files"
          which node || echo "node NOT FOUND"
          node --version 2>&1
          cd artifacts/api-server
          node build.mjs 2>&1 || echo "EXIT CODE: $?"

      - name: Prepare deployment package
        run: |
          echo "=== Preparing deployment package ==="
          # The build output is in artifacts/api-server/api and artifacts/api-server/dist
          echo "API dir: $(ls artifacts/api-server/api/ 2>&1 || echo 'NOT FOUND')"
          echo "Dist dir: $(ls artifacts/api-server/dist/ 2>&1 || echo 'NOT FOUND')"
          echo "Root node_modules/@workspace:"
          ls node_modules/@workspace/ 2>&1 || echo "NOT FOUND"
          # Copy node_modules/@workspace/ to api-server/node_modules/ for deployment
          mkdir -p artifacts/api-server/node_modules/@workspace
          cp -r node_modules/@workspace/* artifacts/api-server/node_modules/@workspace/
          # Copy production deps
          mkdir -p artifacts/api-server/node_modules
          for dep in \
            zod drizzle-orm drizzle-zod pg \
            cookie-parser cors express express-rate-limit \
            jose nanoid pino pino-http pino-pretty \
            thread-stream docx \
            @supabase/supabase-js \
            @citation-js/core @citation-js/plugin-doi @citation-js/plugin-isbn \
            @vercel/node; do
            cp -r "node_modules/$dep" artifacts/api-server/node_modules/ 2>/dev/null || true
          done
          # Cleanup: remove dev-only deps from api-server node_modules
          rm -rf artifacts/api-server/node_modules/@types 2>/dev/null || true
          rm -rf artifacts/api-server/node_modules/esbuild 2>/dev/null || true
          rm -rf artifacts/api-server/node_modules/typescript 2>/dev/null || true
          echo "Deployment package prepared"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-server-dist
          path: |
            artifacts/api-server/api
            artifacts/api-server/dist
            artifacts/api-server/node_modules
            artifacts/api-server/package.json
          retention-days: 1

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://api-server-mocha-eight.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: api-server-dist
          path: artifacts/api-server

      - name: Deploy to Vercel
        run: |
          echo "Vercel token available: ${{ secrets.VERCEL_TOKEN != '' }}"
          npm install -g vercel
          echo "Vercel CLI version: $(vercel --version)"
          # Skip Vercel's build — artifact already built
          echo '{"framework":null,"installCommand":":","buildCommand":":"}' > artifacts/api-server/vercel.json
          vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --project=api-server \
            --yes \
            --cwd=artifacts/api-server

      - name: Health check
        run: |
          sleep 5
          curl -sf --retry 5 --retry-delay 5 \
            --retry-connrefused \
            https://api-server-mocha-eight.vercel.app/api/healthz \
            || echo "Warning: Health check failed — verify manually at https://vercel.com/dashboard"
