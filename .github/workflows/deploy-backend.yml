name: Deploy Backend (manual trigger — Vercel-native)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger (logged in audit)"
        required: false
        default: "Manual re-deploy"

permissions:
  contents: read

# NOTE: This workflow is a MANUAL fallback for backend deploys.
# Backend auto-deploy uses the legacy Layer 1 CLI workflow (.github/workflows/deploy-backend.legacy.yml
# or current main branch behavior — see DECISION 019).
# Vercel Deploy Hook for backend is NOT configured yet because teora-backend project
# is not linked to GitHub and Vercel cannot auto-build the workspace plugin.
# Use this workflow only if Layer 1 fails and you need a different deployment path.
jobs:
  trigger-vercel:
    name: Trigger Vercel Deploy Hook (if configured)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://teora-backend.vercel.app
    steps:
      - name: Verify secret present
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD_BACKEND }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_PROD_BACKEND secret is empty."
            echo "::error::Backend Vercel project is not GitHub-linked yet. Use Layer 1 CLI deploy instead."
            echo "::error::See docs/ai-team/devops/deploy-hook-setup.md for full setup."
            exit 1
          fi

      - name: Trigger Vercel production deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD_BACKEND }}
          REASON: ${{ inputs.reason }}
        run: |
          echo "Reason: $REASON"
          echo "Triggering Vercel deploy hook for teora-backend (production)..."
          HTTP_CODE=$(curl -sS -o /tmp/vercel-response.json -w "%{http_code}" -X POST "$HOOK")
          echo "HTTP status: $HTTP_CODE"
          echo "Response:"
          cat /tmp/vercel-response.json
          echo ""
          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Vercel deploy hook failed (expected HTTP 201, got $HTTP_CODE)"
            exit 1
          fi
          echo "✅ Vercel deploy triggered. Monitor at: https://vercel.com/dashboard"

      - name: Wait for Vercel propagation
        run: |
          echo "Waiting 60 seconds for Vercel build + propagation..."
          sleep 60

      - name: Post-deploy health check
        run: |
          BACKEND_URL="https://teora-backend.vercel.app"
          echo "Checking: $BACKEND_URL/api/healthz"
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/healthz" --max-time 30)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Backend health OK (HTTP $HTTP_CODE)"
          else
            echo "::error::Backend returned HTTP $HTTP_CODE — production may be broken. Rollback via Vercel dashboard if needed."
            exit 1
          fi
