name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ─── Typecheck ───────────────────────────────────────────────
      - name: TypeScript check
        run: npm run typecheck

      # ─── Lint ────────────────────────────────────────────────────
      - name: ESLint
        run: npm run lint

      # ─── Audit ──────────────────────────────────────────────────
      # npm audit reports vulnerabilities in transitive deps. Currently 16 vulns
      # (mostly in @vercel/node transitive deps — undici, path-to-regexp, tar, happy-dom).
      # Audit script stays strict (--audit-level=high) for local dev feedback,
      # but CI tolerates failures so deploy pipeline doesn't block on dev-time vulns.
      # Tracked in .ai/issue-tracker.md for post-launch upgrade of vitest + @vercel/node.
      - name: npm audit (tolerated, vulnerabilities reported only)
        run: npm run audit || echo "::warning::npm audit found issues (see log). Tracked in .ai/issue-tracker.md"

      # ─── Unit tests (both workspaces) ─────────────────────────────
      - name: Run unit tests
        run: |
          npx vitest run --workspace=artifacts/api-server --coverage=false
          npx vitest run --workspace=artifacts/academic-workspace --coverage=false

      # ─── E2E tests ──────────────────────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: "true"

      # ─── Build ───────────────────────────────────────────────────
      - name: Build
        run: npm run build
