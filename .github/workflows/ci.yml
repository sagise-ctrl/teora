name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ─── Typecheck ───────────────────────────────────────────────
      - name: TypeScript check
        run: npm run typecheck

      # ─── Lint ────────────────────────────────────────────────────
      - name: ESLint
        run: npm run lint

      # ─── Audit ──────────────────────────────────────────────────
      - name: npm audit
        run: npm run audit

      # ─── Unit tests (both workspaces) ─────────────────────────────
      - name: Run unit tests
        run: |
          npx vitest run --workspace=artifacts/api-server --coverage=false
          npx vitest run --workspace=artifacts/academic-workspace --coverage=false

      # ─── E2E tests ──────────────────────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: "true"

      # ─── Build ───────────────────────────────────────────────────
      - name: Build
        run: npm run build
