name: Auto-create PR

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Auto-create PR
    runs-on: ubuntu-latest
    steps:
      - name: Create PR if not exists
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const headBranch = context.payload.head_commit?.ref || branch;

            // Check if PR already exists for this branch
            const existingPRs = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              state: 'open',
            });

            if (existingPRs.data.length > 0) {
              console.log(`PR already exists: #${existingPRs.data[0].number}`);
              return;
            }

            // Create PR
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: `WIP: ${branch}`,
              head: branch,
              base: 'main',
              body: [
                `**Branch:** \`${branch}\``,
                '',
                '🤖 Auto-created PR — CI will run automatically.',
                'Add `auto-merge` label to enable auto-merge to main.',
                '',
                '---',
                '## Summary',
                '_Fill in description_',
                '',
                '## Test plan',
                '- [ ] _Add test steps_',
              ].join('\n'),
            });

            // Add auto-merge label
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.data.number,
              labels: ['auto-merge'],
            });

            console.log(`Created PR #${pr.data.number} with auto-merge label`);
