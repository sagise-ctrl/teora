name: Deploy Frontend (DISABLED — Vercel Git Integration handles auto-deploy)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger (Vercel auto-deploy is primary path)"
        required: false
        default: "Manual re-deploy via Vercel dashboard failed"

permissions:
  contents: read

# NOTE: This workflow is DISABLED for push triggers.
# Vercel Git Integration (https://vercel.com/sagise-ctrls-projects/academic-workspace/settings/git)
# now handles auto-deploy: push to `main` → Vercel auto-builds → auto-deploys to production.
#
# Verified working 2026-09-14: push branch `fix/deploy-pipeline-hardening` → Vercel auto-deployed
# preview in 73 seconds, production remained at HTTP 200.
#
# This workflow is kept as a manual fallback ONLY. Use Actions tab → Run workflow if Vercel
# integration is broken and you need to trigger a deploy via Deploy Hook.
#
# To RE-ENABLE auto-deploy via this workflow: add back `push: branches: [main]` trigger.
jobs:
  trigger-vercel:
    name: Trigger Vercel Deploy Hook (manual only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://academic-workspace-eta.vercel.app
    steps:
      - name: Verify secret present
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_PROD secret is empty."
            echo "::error::Frontend uses Vercel Git Integration for auto-deploy. This manual trigger is a fallback."
            echo "::error::Set VERCEL_DEPLOY_HOOK_PROD secret if you need this fallback path."
            exit 1
          fi

      - name: Trigger Vercel production deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}
          REASON: ${{ inputs.reason }}
        run: |
          echo "Reason: $REASON"
          echo "Triggering Vercel deploy hook for academic-workspace (production)..."
          HTTP_CODE=$(curl -sS -o /tmp/vercel-response.json -w "%{http_code}" -X POST "$HOOK")
          echo "HTTP status: $HTTP_CODE"
          echo "Response:"
          cat /tmp/vercel-response.json
          echo ""
          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Vercel deploy hook failed (expected HTTP 201, got $HTTP_CODE)"
            exit 1
          fi
          echo "✅ Vercel deploy triggered. Monitor at: https://vercel.com/dashboard"

      - name: Wait for Vercel propagation
        run: |
          echo "Waiting 60 seconds for Vercel build + propagation..."
          sleep 60

      - name: Post-deploy health check
        run: |
          FRONTEND_URL="https://academic-workspace-eta.vercel.app"
          echo "Checking: $FRONTEND_URL"
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$FRONTEND_URL" --max-time 30)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Frontend health OK (HTTP $HTTP_CODE)"
          else
            echo "::error::Frontend returned HTTP $HTTP_CODE — production may be broken. Rollback via Vercel dashboard if needed."
            exit 1
          fi
