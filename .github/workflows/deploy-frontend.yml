name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "artifacts/academic-workspace/**"
      - "lib/api-client-react/**"
      - "lib/api-zod/**"
      - "lib/db/src/schema/**"
      - ".vercelignore"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://academic-workspace-eta.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build & Deploy to Vercel
        working-directory: artifacts/academic-workspace
        env:
          VITE_SUPABASE_URL: ${{ secrets.FRONTEND_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.FRONTEND_VITE_SUPABASE_ANON_KEY }}
          VITE_MOCK: "false"
          VITE_API_URL: "/api"
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel
          echo "=== Building with vercel CLI (local build, bypasses gitignore) ==="
          # vercel build runs the project's buildCommand and puts output in .vercel/output.
          # This local build bypasses git-based file discovery, so dist/ in .gitignore is not an issue.
          npx vercel build --prod --cwd . 2>&1 | tail -10
          echo "=== Deploying prebuilt output ==="
          npx vercel deploy \
            --token="$VERCEL_TOKEN" \
            --prod --yes --prebuilt \
            --project=academic-workspace 2>&1
          echo "=== Deployment complete ==="

      - name: Deployment summary
        run: |
          echo "Frontend deployed to Vercel production."
          echo "Verify at: https://academic-workspace-eta.vercel.app"
