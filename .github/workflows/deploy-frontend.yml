name: Deploy Frontend (thin trigger)

on:
  push:
    branches: [main]
    paths:
      - "artifacts/academic-workspace/**"
      - "lib/api-client-react/**"
      - "lib/api-zod/**"
      - "lib/db/src/schema/**"
      - "package.json"
      - "package-lock.json"
      - ".vercelignore"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-vercel:
    name: Trigger Vercel Deploy Hook
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://academic-workspace-eta.vercel.app
    steps:
      - name: Verify secret present
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_PROD secret is empty. See docs/ai-team/devops/deploy-hook-setup.md"
            exit 1
          fi

      - name: Trigger Vercel production deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}
        run: |
          echo "Triggering Vercel deploy hook for academic-workspace (production)..."
          HTTP_CODE=$(curl -sS -o /tmp/vercel-response.json -w "%{http_code}" -X POST "$HOOK")
          echo "HTTP status: $HTTP_CODE"
          echo "Response:"
          cat /tmp/vercel-response.json
          echo ""
          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Vercel deploy hook failed (expected HTTP 201, got $HTTP_CODE)"
            exit 1
          fi
          echo "✅ Vercel deploy triggered. Monitor at: https://vercel.com/dashboard"

      - name: Wait for Vercel propagation
        run: |
          echo "Waiting 60 seconds for Vercel build + propagation..."
          sleep 60

      - name: Post-deploy health check
        run: |
          FRONTEND_URL="https://academic-workspace-eta.vercel.app"
          echo "Checking: $FRONTEND_URL"
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$FRONTEND_URL" --max-time 30)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Frontend health OK (HTTP $HTTP_CODE)"
          else
            echo "::error::Frontend returned HTTP $HTTP_CODE — production may be broken. Rollback via Vercel dashboard if needed."
            exit 1
          fi

      - name: API smoke test
        run: |
          BACKEND_URL="https://teora-backend.vercel.app"
          echo "Checking API: $BACKEND_URL/api/healthz"
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/healthz" --max-time 30)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ API smoke OK (HTTP $HTTP_CODE)"
          else
            echo "::warning::API returned HTTP $HTTP_CODE — may indicate drift or backend issue (see .ai/issue-tracker.md)"
          fi
