name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "artifacts/academic-workspace/**"
      - "lib/api-client-react/**"
      - "lib/api-zod/**"
      - "lib/db/src/schema/**"
      - "package.json"
      - "package-lock.json"
      - ".vercelignore"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://academic-workspace-eta.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No cache — lightningcss optional binary must be freshly installed on Linux runner

      - name: Install dependencies (repo root — has lockfile + workspace config)
        run: |
          # npm has a bug where optional native binaries corrupt across CI runs
          # (npm/cli#4828). Fix: nuke node_modules and reinstall fresh.
          rm -rf node_modules
          npm install --legacy-peer-deps --include=dev --include=optional

      - name: Build & Deploy to Vercel
        working-directory: artifacts/academic-workspace
        env:
          VITE_SUPABASE_URL: ${{ secrets.FRONTEND_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.FRONTEND_VITE_SUPABASE_ANON_KEY }}
          VITE_MOCK: "false"
          VITE_API_URL: "/api"
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel@latest
          echo "=== Pulling project settings ==="
          npx vercel pull --yes --token="$VERCEL_TOKEN" 2>&1 | tail -3
          echo "=== Verifying deps are installed ==="
          ls ../../node_modules/@vitejs/plugin-react/package.json 2>&1
          ls ../../node_modules/vite/package.json 2>&1
          echo "=== Building ==="
          npx vite build 2>&1 | tail -15
          echo "=== Verifying dist/ ==="
          ls dist/ 2>&1 | tail -3
          echo "=== Creating Vercel prebuilt output ==="
          mkdir -p .vercel/output/static
          cp -r dist/* .vercel/output/static/
          # SPA: (1) root serves index, (2) static assets, (3) all other paths fallback to index
          # Route order matters — more specific first, wildcard last
          printf '{"version":3,"routes":[{"src":"/","dest":"/static/index.html"},{"src":"/static/(.*)","dest":"/static/$1"},{"src":"/(.*)","dest":"/static/index.html"}]}' > .vercel/output/config.json
          echo "=== Deploying prebuilt ==="
          npx vercel deploy \
            --token="$VERCEL_TOKEN" \
            --prod --yes --prebuilt \
            --project=academic-workspace 2>&1
          echo "=== Deployment complete ==="

      - name: Deployment summary
        run: |
          echo "Frontend deployed to Vercel production."
          echo "Verify at: https://academic-workspace-eta.vercel.app"
