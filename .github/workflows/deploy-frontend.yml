name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "artifacts/academic-workspace/**"
      - "lib/api-client-react/**"
      - "lib/api-zod/**"
      - "lib/db/src/schema/**"
      - ".vercelignore"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://academic-workspace-eta.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Frontend
        working-directory: artifacts/academic-workspace
        env:
          VITE_SUPABASE_URL: ${{ secrets.FRONTEND_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.FRONTEND_VITE_SUPABASE_ANON_KEY }}
          VITE_MOCK: "false"
          VITE_API_URL: "/api"
        run: npm run build 2>&1 | tee build.log || { echo "::error::Frontend build failed"; tail -80 build.log; exit 1; }

      - name: Deploy to Vercel
        working-directory: artifacts/academic-workspace
        run: |
          npm install -g vercel
          echo "=== vercel.json contents ==="
          cat vercel.json
          echo "=== dist/ contents ==="
          ls -la dist/ | head -20
          echo "=== Running vercel deploy ==="
          # Use --no-git so vercel uploads the directory as-is, bypassing .gitignore.
          # dist/ is gitignored but --no-git makes vercel ignore git entirely.
          # Run from artifacts/academic-workspace so vercel.json (outputDirectory: dist)
          # points to the right local path.
          set -o pipefail
          vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --project=academic-workspace \
            --prod \
            --yes \
            --no-git 2>&1 | tee deploy.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::vercel deploy failed with exit code $rc"
            tail -60 deploy.log
            exit "$rc"
          fi

      - name: Deployment summary
        run: |
          echo "Frontend deployed to Vercel production."
          echo "Verify at: https://academic-workspace-eta.vercel.app"
