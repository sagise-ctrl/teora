<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <title>Landing Page Background Pattern</title>
  <desc>Subtle hexagonal geometric pattern for Teora landing page hero section</desc>

  <defs>
