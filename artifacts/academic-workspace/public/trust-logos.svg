<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" role="img" aria-label="Teora logo strip">
  <title>Trusted by educational institutions</title>
  <desc>Abstract logo representations for social proof strip</desc>

  <defs>
    <linearGradient id="stripGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D79FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8E54E9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2D79FF" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- University placeholder icons (abstract academic logos) -->
  <!-- Logo 1: Book/Cap -->
  <g transform="translate(20, 10)">
    <rect x="5" y="20" width="30" height="3" rx="1.5" fill="url(#stripGrad)"/>
    <rect x="8" y="15" width="24" height="6" rx="1" fill="url(#stripGrad)" opacity="0.7"/>
    <rect x="10" y="8" width="20" height="8" rx="2" fill="url(#stripGrad)"/>
    <rect x="0" y="5" width="40" height="2" rx="1" fill="url(#stripGrad)" opacity="0.5"/>
  </g>

  <!-- Logo 2: Circle with lines (university crest) -->
  <g transform="translate(90, 8)">
    <circle cx="20" cy="22" r="18" fill="none" stroke="url(#stripGrad)" stroke-width="2" opacity="0.6"/>
    <circle cx="20" cy="22" r="12" fill="none" stroke="url(#stripGrad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="20" y1="4" x2="20" y2="40" stroke="url(#stripGrad)" stroke-width="1.5" opacity="0.5"/>
    <line x1="2" y1="22" x2="38" y2="22" stroke="url(#stripGrad)" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Logo 3: Hexagon (matching Teora brand) -->
  <g transform="translate(160, 8)">
    <polygon points="20,2 38,12 38,32 20,42 2,32 2,12" fill="none" stroke="url(#stripGrad)" stroke-width="2" opacity="0.6"/>
    <polygon points="20,10 30,16 30,28 20,34 10,28 10,16" fill="url(#stripGrad)" opacity="0.2"/>
  </g>

  <!-- Logo 4: Shield -->
  <g transform="translate(230, 8)">
    <path d="M20 2 L38 10 L38 28 Q38 40 20 48 Q2 40 2 28 L2 10 Z" fill="none" stroke="url(#stripGrad)" stroke-width="2" opacity="0.6"/>
    <path d="M20 8 L32 14 L32 26 Q32 36 20 42 Q8 36 8 26 L8 14 Z" fill="url(#stripGrad)" opacity="0.15"/>
  </g>

  <!-- Logo 5: Building/Institution -->
  <g transform="translate(300, 8)">
    <rect x="2" y="10" width="36" height="32" rx="2" fill="none" stroke="url(#stripGrad)" stroke-width="2" opacity="0.6"/>
    <rect x="8" y="16" width="8" height="8" rx="1" fill="url(#stripGrad)" opacity="0.3"/>
    <rect x="22" y="16" width="8" height="8" rx="1" fill="url(#stripGrad)" opacity="0.3"/>
    <rect x="14" y="32" width="12" height="10" rx="1" fill="url(#stripGrad)" opacity="0.5"/>
    <line x1="2" y1="10" x2="20" y2="2" stroke="url(#stripGrad)" stroke-width="2" opacity="0.4"/>
    <line x1="38" y1="10" x2="20" y2="2" stroke="url(#stripGrad)" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Logo 6: Globe/Network -->
  <g transform="translate(360, 8)">
    <circle cx="16" cy="22" r="14" fill="none" stroke="url(#stripGrad)" stroke-width="2" opacity="0.6"/>
    <ellipse cx="16" cy="22" rx="6" ry="14" fill="none" stroke="url(#stripGrad)" stroke-width="1" opacity="0.4"/>
    <line x1="2" y1="22" x2="30" y2="22" stroke="url(#stripGrad)" stroke-width="1" opacity="0.4"/>
    <path d="M4 14 Q16 8 28 14" fill="none" stroke="url(#stripGrad)" stroke-width="1" opacity="0.4"/>
    <path d="M4 30 Q16 36 28 30" fill="none" stroke="url(#stripGrad)" stroke-width="1" opacity="0.4"/>
  </g>

  <text x="200" y="56" text-anchor="middle" fill="url(#stripGrad)" font-size="8" font-family="Inter, sans-serif" opacity="0.5">dan 500+ institusi pendidikan</text>
</svg>
