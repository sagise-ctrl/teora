openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI Academic Workspace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: projects
    description: Project management
  - name: messages
    description: AI chat per project
  - name: documents
    description: Document versions
  - name: references
    description: Academic references
  - name: attachments
    description: File attachments
  - name: activities
    description: Activity timeline
  - name: jobs
    description: AI job queue
  - name: exports
    description: Document exports
  - name: metadata
    description: Project metadata
  - name: ai-usage
    description: AI usage tracking (FinOps)
  - name: finops
    description: FinOps usage analytics (user and admin)
  - name: comments
    description: Inline comments on documents
  - name: members
    description: Project collaborators and roles
  - name: quizzes
    description: AI-generated quizzes and assessments
  - name: profile
    description: User profile management
  - name: style-profile
    description: Writing style analysis
  - name: templates
    description: Document templates
  - name: account-references
    description: Global Reference Library — account-level personal reference pool
  - name: admin
    description: Admin (owner) dashboard — user management, financials, system config
paths:
  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange Supabase token for server session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid token

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out and clear session
      responses:
        "200":
          description: Logged out

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      responses:
        "200":
          description: Token refreshed
        "401":
          description: Session expired

  /auth/referrals:
    get:
      operationId: getReferrals
      tags: [auth]
      summary: Get referral stats and list for current user
      responses:
        "200":
          description: Referral stats and list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralListResponse"
        "401":
          description: Unauthorized

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Projects ──────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: type
          in: query
          description: Filter by project type (general or academic)
          schema:
            type: string
            enum: [general, academic]
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/stats:
    get:
      operationId: getProjectStats
      tags: [projects]
      summary: Dashboard summary stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/analyze:
    post:
      operationId: analyzeProject
      tags: [projects]
      summary: Trigger full AI analysis pipeline for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tier:
                  type: string
                  description: AI tier to use (e.g. "free", "standard", "premium"). Defaults to user's preferred tier.
                  example: "standard"
      responses:
        "202":
          description: Analysis started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  # ── Messages (per-project chat) ───────────────────────────────────────────
  /projects/{projectId}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: Get chat history for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message and get AI response
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: AI response message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "402":
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalanceError"

  # ── Documents ─────────────────────────────────────────────────────────────
  /projects/{projectId}/documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List all documents in a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Documents with versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentWithVersions"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create a new document in a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /projects/{projectId}/documents/latest:
    get:
      operationId: getLatestDocument
      tags: [documents]
      summary: Get the latest version of the active document
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Latest document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVersion"
        "404":
          description: No document yet

  /projects/{projectId}/documents/{documentId}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a document with all its versions
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: documentId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Document with versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentWithVersions"
        "404":
          description: Document not found
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Update a document
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: documentId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Document updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document and all its versions
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: documentId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Document deleted
        "404":
          description: Document not found

  /projects/{projectId}/outline:
    post:
      operationId: regenerateOutline
      tags: [documents]
      summary: Regenerate outline for the active document
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                documentId:
                  type: number
                  description: Target document ID (optional, uses active document)
                userOutline:
                  type: string
                  description: Optional user-modified outline to refine
                tier:
                  type: string
                  description: AI tier to use (e.g. "free", "standard", "premium"). Defaults to user's preferred tier.
                  example: "standard"
      responses:
        "200":
          description: New outline
          content:
            application/json:
              schema:
                type: object
                properties:
                  outline:
                    type: string

  /projects/{projectId}/documents/generate:
    post:
      operationId: generateDocument
      tags: [documents]
      summary: Generate content for a document (or active document if documentId not provided)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                documentId:
                  type: number
                  description: Target document ID (optional, uses active document if omitted)
                tier:
                  type: string
                  description: AI tier to use (e.g. "free", "standard", "premium"). Defaults to user's preferred tier.
                  example: "standard"
      responses:
        "202":
          description: Document generation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: number
                  status:
                    type: string

  # ── References ────────────────────────────────────────────────────────────
  /projects/{projectId}/references:
    get:
      operationId: listReferences
      tags: [references]
      summary: List all references for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: References
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reference"
    post:
      operationId: createReference
      tags: [references]
      summary: Add a reference manually
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceInput"
      responses:
        "201":
          description: Created reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reference"

  /projects/{projectId}/references/bulk:
    post:
      operationId: bulkAddReferences
      tags: [references]
      summary: Add multiple references at once
      description: Useful for bulk-adding auto-suggested references or batch import. Skips references with duplicate DOIs.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAddReferencesRequest"
      responses:
        "201":
          description: Created references
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reference"

  /projects/{projectId}/references/{referenceId}:
    delete:
      operationId: deleteReference
      tags: [references]
      summary: Delete a reference
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: referenceId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/references/regenerate:
    post:
      operationId: regenerateBibliography
      tags: [references]
      summary: Regenerate bibliography for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tier:
                  type: string
                  description: AI tier to use (e.g. "free", "standard", "premium"). Defaults to user's preferred tier.
                  example: "standard"
      responses:
        "200":
          description: Updated bibliography text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BibliographyResult"

  /projects/{projectId}/references/validate:
    post:
      operationId: validateReferences
      tags: [references]
      summary: Validate all references against the citation format
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Validation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceValidationResult"

  /projects/{projectId}/references/format:
    post:
      operationId: formatCSLBibliography
      tags: [references]
      summary: Format references as a CSL-formatted bibliography
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [APA, APA7, IEEE, Vancouver, Chicago, MLA, Harvard]
      responses:
        "200":
          description: Formatted bibliography text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BibliographyResult"

  /references/fetch-metadata:
    post:
      operationId: fetchReferenceMetadata
      tags: [references]
      summary: Fetch reference metadata by DOI or ISBN
      description: Accepts a DOI or ISBN identifier and fetches metadata from CrossRef or Open Library.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchReferenceMetadataRequest"
      responses:
        "200":
          description: Fetched metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchedReferenceMetadata"
        "400":
          description: Unsupported or invalid identifier
        "404":
          description: Metadata not found
        "502":
          description: External API unavailable

  /references/search:
    get:
      operationId: searchReferences
      tags: [references]
      summary: Search academic papers from CrossRef
      description: Search CrossRef for academic papers by topic, keyword, or title. Returns structured metadata including authors, year, journal, and DOI.
      parameters:
        - name: q
          in: query
          required: true
          description: Search query (minimum 3 characters)
          schema:
            type: string
            minLength: 3
        - name: rows
          in: query
          required: false
          description: Number of results to return (max 50)
          schema:
            type: number
            default: 20
            maximum: 50
        - name: offset
          in: query
          required: false
          description: Number of results to skip for pagination
          schema:
            type: number
            default: 0
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossRefSearchResponse"
        "400":
          description: Query too short (minimum 3 characters)
        "502":
          description: CrossRef API unavailable

  /projects/{projectId}/share:
    get:
      operationId: listShareLinks
      tags: [projects]
      summary: List all share links for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Share links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShareLink"
        "401":
          description: Unauthorized
    post:
      operationId: createShareLink
      tags: [projects]
      summary: Create a share link for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareLinkRequest"
      responses:
        "201":
          description: Share link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLink"
        "401":
          description: Unauthorized

  /projects/{projectId}/share/{shareId}:
    delete:
      operationId: deleteShareLink
      tags: [projects]
      summary: Revoke a share link
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: shareId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Share link revoked
        "401":
          description: Unauthorized
        "404":
          description: Share link not found

  /shared/{token}:
    get:
      operationId: accessSharedProject
      tags: [projects]
      summary: Access a shared project via token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared project data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedProject"
        "404":
          description: Invalid or expired share link

  # ── Attachments ───────────────────────────────────────────────────────────
  /projects/{projectId}/attachments:
    get:
      operationId: listAttachments
      tags: [attachments]
      summary: List attachments for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"
    post:
      operationId: uploadAttachment
      tags: [attachments]
      summary: Upload an attachment as base64 JSON
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentUpload"
      responses:
        "201":
          description: Uploaded attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"

  /projects/{projectId}/attachments/{attachmentId}:
    delete:
      operationId: deleteAttachment
      tags: [attachments]
      summary: Delete an attachment
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: attachmentId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/attachments/{attachmentId}/download:
    get:
      operationId: downloadAttachment
      tags: [attachments]
      summary: Download an attachment file
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: attachmentId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: File binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "404":
          description: Not found

  # ── Activities ────────────────────────────────────────────────────────────
  /projects/{projectId}/activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: Get activity timeline for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"

  # ── Jobs ──────────────────────────────────────────────────────────────────
  /projects/{projectId}/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List AI jobs for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  # ── Metadata ──────────────────────────────────────────────────────────────
  /projects/{projectId}/metadata:
    get:
      operationId: getProjectMetadata
      tags: [metadata]
      summary: Get analyzed metadata for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMetadata"
        "404":
          description: No metadata yet

  # ── AI Usage (FinOps) ───────────────────────────────────────────────────
  /ai-usage:
    get:
      operationId: listAIUsage
      tags: [ai-usage]
      summary: List AI usage records
      parameters:
        - name: userId
          in: query
          schema:
            type: string
          description: Filter by user (admin only, defaults to current user)
        - name: projectId
          in: query
          schema:
            type: number
          description: Filter by project
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: number
            default: 50
        - name: offset
          in: query
          schema:
            type: number
            default: 0
      responses:
        "200":
          description: AI usage records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AIUsageLog"
                  total:
                    type: number
        "401":
          description: Unauthorized

  /ai-usage/stats:
    get:
      operationId: getAIUsageStats
      tags: [ai-usage]
      summary: Get aggregated AI usage statistics
      parameters:
        - name: userId
          in: query
          schema:
            type: string
          description: Filter by user (admin only, defaults to current user)
