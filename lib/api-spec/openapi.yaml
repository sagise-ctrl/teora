      tags: [templates]
      summary: Create a new document template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentTemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTemplate"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /templates/categories:
    get:
      operationId: listTemplateCategories
      tags: [templates]
      summary: List available template categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /templates/{templateId}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get a template by ID
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTemplate"
        "404":
          description: Not found
    patch:
      operationId: updateTemplate
      tags: [templates]
      summary: Update a template
      description: Only the template owner can update. System templates are read-only.
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentTemplateUpdate"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTemplate"
        "403":
          description: Forbidden — cannot modify system templates or templates you do not own
        "404":
          description: Not found
    delete:
      operationId: deleteTemplate
      tags: [templates]
      summary: Delete a template
      description: Only the template owner can delete. System templates cannot be deleted.
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  # ── Account References (Global Reference Library) ──────────────────────────
  /account/references:
    get:
      operationId: listAccountReferences
      tags: [account-references]
      summary: List account-level references
      description: Returns all references in the authenticated user's personal reference pool.
      responses:
        "200":
          description: Account references
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountReference"
        "401":
          description: Unauthorized
    post:
      operationId: createAccountReference
      tags: [account-references]
      summary: Add reference to personal pool
      description: Adds a new reference to the user's account-level library. Duplicate DOIs are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountReferenceInput"
      responses:
        "201":
          description: Created reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountReference"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "409":
          description: Reference with this DOI already exists

  /account/references/import:
    post:
      operationId: importAccountReferences
      tags: [account-references]
      summary: Bulk import references from DOIs
      description: Fetches metadata from CrossRef for each DOI and adds valid references to the account library. Skips duplicates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportAccountReferencesRequest"
      responses:
        "201":
          description: Import results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAccountReferencesResponse"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /account/references/{id}:
    put:
      operationId: updateAccountReference
      tags: [account-references]
      summary: Update an account reference
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountReferenceInput"
      responses:
        "200":
          description: Updated reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountReference"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "404":
          description: Reference not found
        "409":
          description: Reference with this DOI already exists
    delete:
      operationId: deleteAccountReference
      tags: [account-references]
      summary: Delete an account reference
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Reference not found

  /account/references/{id}/assign:
    post:
      operationId: assignAccountReference
      tags: [account-references]
      summary: Assign account reference to a project
      description: Copies an account-level reference into a project's reference pool.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId:
                  type: number
      responses:
        "201":
          description: Reference added to project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reference"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "404":
          description: Account reference not found
        "409":
          description: Reference already exists in the project

  # ── Admin ────────────────────────────────────────────────────────────────
  /admin/me:
    get:
      operationId: getAdminStatus
      tags: [admin]
      summary: Get admin (owner) status
      description: Returns whether the current user is the owner/admin.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"
        "401":
          description: Unauthorized

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by email or display name
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: limit
          in: query
          schema:
            type: number
            default: 20
      responses:
        "200":
          description: List of users with stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "403":
          description: Forbidden — admin access required

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get aggregate system stats (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [today, week, month]
            default: month
      responses:
        "200":
          description: System statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "403":
          description: Forbidden

  /admin/usage-breakdown:
    get:
      operationId: getAdminUsage
      tags: [admin]
      summary: Get AI usage breakdown (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [today, week, month]
            default: month
      responses:
        "200":
          description: AI usage breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsage"
        "403":
          description: Forbidden

  /admin/audit-log:
    get:
      operationId: getAdminAuditLog
      tags: [admin]
      summary: Get admin audit log (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: limit
          in: query
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogList"
        "403":
          description: Forbidden

  /admin/users/{userId}/tier:
    post:
      operationId: overrideUserTier
      tags: [admin]
      summary: Override user tier (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tierId:
                  type: ["string", "null"]
                  description: Tier ID to set, or null to remove override
      responses:
        "200":
          description: Tier override applied
        "403":
          description: Forbidden

  /admin/users/{userId}/suspend:
    post:
      operationId: suspendUser
      tags: [admin]
      summary: Suspend or unsuspend user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspend]
              properties:
                suspend:
                  type: boolean
      responses:
        "200":
          description: User suspended or unsuspended
        "403":
          description: Forbidden

components:
  schemas:
    # ── Admin ─────────────────────────────────────────────────────────────────
    AdminStatus:
      type: object
      required: [isOwner, email]
      properties:
        isOwner:
          type: boolean
        email:
          type: string

    AdminUserList:
      type: object
      required: [users, pagination]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AdminUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        referralCode:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        projectCount:
          type: number
        totalRequests:
          type: number
        totalCostUsd:
          type: number

    AdminStats:
      type: object
      properties:
        period:
          type: string
        totals:
          type: object
          properties:
            users:
              type: number
            projects:
              type: number
            aiRequests:
              type: number
            aiCostUsd:
              type: number
            inputTokens:
              type: number
            outputTokens:
              type: number
        revenue:
          type: object
          properties:
            totalTopupCents:
              type: number
            totalRefundCents:
              type: number
            transactionCount:
              type: number
            grossMargin:
              type: number
        ownerUsage:
          type: object
          properties:
            totalRequests:
              type: number
            totalCostUsd:
              type: number
        topConsumers:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
              requests:
                type: number
              costUsd:
                type: number

    AdminUsage:
      type: object
      properties:
        period:
          type: string
        byProvider:
          type: array
          items:
            $ref: "#/components/schemas/AdminUsageByProvider"
        byModel:
          type: array
          items:
            $ref: "#/components/schemas/AdminUsageByModel"
        byRequestType:
          type: array
          items:
            $ref: "#/components/schemas/AdminUsageByRequestType"

    AdminUsageByProvider:
      type: object
      properties:
        provider:
          type: string
        totalRequests:
          type: number
        totalCostUsd:
          type: number
        totalInputTokens:
          type: number
        totalOutputTokens:
          type: number

    AdminUsageByModel:
      type: object
      properties:
        model:
          type: string
        provider:
          type: string
        totalRequests:
          type: number
        totalCostUsd:
          type: number
        totalInputTokens:
          type: number
        totalOutputTokens:
          type: number

    AdminUsageByRequestType:
      type: object
      properties:
        requestType:
          type: string
        totalRequests:
          type: number
        totalCostUsd:
          type: number
        totalInputTokens:
          type: number
        totalOutputTokens:
          type: number

    AdminAuditLogList:
      type: object
      required: [logs, pagination]
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuditLog"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AdminAuditLog:
      type: object
      properties:
        id:
          type: number
        adminEmail:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: ["string", "null"]
        details:
          type: ["object", "null"]
        ipAddress:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ── Auth ─────────────────────────────────────────────────────────────────
    AuthUser:
      type: object
      required: [id, email, isOwner, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        isOwner:
          type: boolean
        referralCode:
          type: ["string", "null"]
          description: Unique referral code this user can share
        createdAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          pattern: "^[^@]+@[^@]+\\.[^@]+$"
        password:
          type: string
          minLength: 6
        displayName:
          type: string
        referralCode:
          type: string
          description: Optional referral code used during registration

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Project ──────────────────────────────────────────────────────────────
    Project:
      type: object
      required: [id, title, status, progress, createdAt, updatedAt]
      properties:
        id:
          type: number
        title:
          type: string
        status:
          type: string
          enum: [draft, analyzing, writing, waiting_revision, completed, archived]
        progress:
          type: number
          description: 0-100 percent
        instructionText:
          type: ["string", "null"]
        subject:
          type: ["string", "null"]
        taskType:
          type: ["string", "null"]
          enum: [general, academic]
        citationFormat:
          type: ["string", "null"]
        outputFormat:
          type: ["string", "null"]
        minRefYear:
          type: ["number", "null"]
        minRefCount:
          type: ["number", "null"]
        aiDisclosure:
          type: boolean
          description: Toggle AI disclosure labels (default true)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        instructionText:
          type: string
        outputFormat:
          type: string
          enum: [docx, pdf, markdown]
        minRefYear:
          type: number
        minRefCount:
          type: number
        aiDisclosure:
          type: boolean
        taskType:
          type: string
          enum: [general, academic]
          description: Project type — "general" for short tasks, "academic" for multi-section works

    ProjectUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        status:
          type: string
          enum: [draft, analyzing, writing, waiting_revision, completed, archived]
        instructionText:
          type: string
        outputFormat:
          type: string
          enum: [docx, pdf, markdown]
        minRefYear:
          type: number
        minRefCount:
          type: number
        progress:
          type: number
        aiDisclosure:
          type: boolean

    ProjectStats:
      type: object
      required: [total, byStatus, recentActivity]
      properties:
        total:
          type: number
        byStatus:
          type: object
          additionalProperties:
            type: number
        byType:
          type: object
          description: Counts grouped by taskType (general, academic, null)
          additionalProperties:
            type: number
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"

    # ── Message ───────────────────────────────────────────────────────────────
    Message:
      type: object
      required: [id, projectId, role, content, createdAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    ChatMode:
      type: string
      enum: [generate, revise, reflect, socratic, quiz, summary]
      description: AI writing assistant mode

    MessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
        mode:
          $ref: "#/components/schemas/ChatMode"
          default: revise
        tier:
          type: string
          description: AI tier to use (e.g. "free", "standard", "premium"). Defaults to user's preferred tier.
          example: "standard"

    # ── Document ─────────────────────────────────────────────────────────────────
    Document:
      type: object
      required: [id, projectId, title, orderIndex, isActive, createdAt, updatedAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        title:
          type: string
        orderIndex:
          type: number
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DocumentTemplate:
      type: object
      properties:
        id:
          type: number
        projectId:
          type: number
        title:
          type: string
        description:
          type: string
        content:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DocumentTemplateInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        content:
          type: string

    DocumentTemplateUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        content:
          type: string
        isActive:
          type: boolean

    DocumentInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          description: Document title (e.g., "Bab 1 Pendahuluan")
        orderIndex:
          type: number
          description: Sort order (optional, defaults to end)

    DocumentUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        orderIndex:
          type: number
        isActive:
          type: boolean

    DocumentWithVersions:
      allOf:
        - $ref: "#/components/schemas/Document"
        - type: object
          properties:
            versions:
              type: array
              items:
                $ref: "#/components/schemas/DocumentVersion"

    # ── DocumentVersion ───────────────────────────────────────────────────────
    DocumentVersion:
      type: object
      required: [id, projectId, versionNumber, content, createdAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        documentId:
          type: ["number", "null"]
          description: Scoped to specific document (null = legacy/project-level)
        versionNumber:
          type: number
        content:
          type: string
        outline:
          type: ["string", "null"]
        changeDescription:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ── Reference ─────────────────────────────────────────────────────────────
    Reference:
      type: object
      required: [id, projectId, title, validationStatus, createdAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        title:
          type: string
        authors:
          type: ["string", "null"]
        year:
          type: ["number", "null"]
        journal:
          type: ["string", "null"]
        volume:
          type: ["string", "null"]
        issue:
          type: ["string", "null"]
        doi:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        validationStatus:
          type: string
          enum: [unverified, verified, invalid]
        usedInChapters:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        isSuggested:
          type: boolean
          description: Whether this reference was auto-suggested by CrossRef
        source:
          type: string
          enum: [manual, crossref, file]
          description: Source of the reference

    ReferenceInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        authors:
          type: string
        year:
          type: number
        journal:
          type: string
        volume:
          type: string
        issue:
          type: string
        doi:
          type: string
        url:
          type: string
        isSuggested:
          type: boolean
          default: false
          description: Whether this reference was auto-suggested by CrossRef search
        source:
          type: string
          enum: [manual, crossref, file]
          default: manual
          description: Source of the reference

    BulkAddReferencesRequest:
      type: object
      required: [references]
      properties:
        references:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceInput"
          maxItems: 100

    BibliographyResult:
      type: object
      required: [bibliography]
      properties:
        bibliography:
          type: string
        format:
          type: string

    ValidationIssue:
      type: object
      required: [severity, message, field]
      properties:
        severity:
          type: string
          enum: [error, warning]
        message:
          type: string
        field:
          type: string

    ReferenceValidation:
      type: object
      required: [id, title, validation]
      properties:
        id:
          type: number
        title:
          type: string
        validation:
          type: object
          properties:
            valid:
              type: boolean
            issues:
              type: array
              items:
                $ref: "#/components/schemas/ValidationIssue"

    ReferenceValidationResult:
      type: object
      required: [format, totalReferences, results]
      properties:
        format:
          type: string
        totalReferences:
          type: number
        totalErrors:
          type: number
        totalWarnings:
          type: number
        results:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceValidation"

    # ── Attachment ────────────────────────────────────────────────────────────
    Attachment:
      type: object
      required: [id, projectId, filename, attachmentType, createdAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        filename:
          type: string
        originalName:
          type: string
        mimeType:
          type: ["string", "null"]
        sizeBytes:
          type: ["number", "null"]
        attachmentType:
          type: string
          enum: [instruction, supplement]
        extractedText:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    AttachmentUpload:
      type: object
      required: [filename, base64Content, attachmentType]
      properties:
        filename:
          type: string
        base64Content:
          type: string
        mimeType:
          type: string
        attachmentType:
          type: string
          enum: [instruction, supplement]

    # ── Activity ──────────────────────────────────────────────────────────────
    Activity:
      type: object
      required: [id, projectId, eventType, description, createdAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        eventType:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    # ── Job ───────────────────────────────────────────────────────────────────
    Job:
      type: object
      required: [id, projectId, jobType, status, createdAt, updatedAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        jobType:
          type: string
          enum: [analyze, outline, references, write_chapter, citations, bibliography, export, generate_quiz, analyze_style]
        status:
          type: string
          enum: [pending, running, completed, failed]
        result:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── ProjectMetadata ───────────────────────────────────────────────────────
    ProjectMetadata:
      type: object
      required: [id, projectId, createdAt, updatedAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        detectedTitle:
          type: ["string", "null"]
        subject:
          type: ["string", "null"]
        taskType:
          type: ["string", "null"]
          enum: [general, academic]
        citationFormat:
          type: ["string", "null"]
        language:
          type: ["string", "null"]
        outline:
          type: ["string", "null"]
        contextSummary:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Export ────────────────────────────────────────────────────────────────
    Export:
      type: object
      required: [id, projectId, format, status, createdAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        format:
          type: string
          enum: [docx, pdf, markdown]
        status:
          type: string
          enum: [pending, completed, failed]
        filePath:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ExportInput:
      type: object
      required: [format]
      properties:
        format:
          type: string
          enum: [docx, pdf, markdown]
        documentVersionId:
          type: number

    # ── Referral ──────────────────────────────────────────────────────────────
    Referral:
      type: object
      required: [id, referrerId, referredId, referralCode, status, createdAt]
      properties:
        id:
          type: number
        referrerId:
          type: string
        referredId:
          type: string
        referredEmail:
          type: string
        referralCode:
          type: string
        status:
          type: string
          enum: [pending, verified, qualified, rewarded, rejected]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReferralEvent:
      type: object
      required: [id, referralId, actorType, toStatus, createdAt]
      properties:
        id:
          type: number
        referralId:
          type: number
        actorId:
          type: ["string", "null"]
        actorType:
          type: string
          enum: [system, user, admin]
        fromStatus:
          type: ["string", "null"]
        toStatus:
          type: string
        reason:
          type: ["string", "null"]
        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time

    ReferralStats:
      type: object
      properties:
        total:
          type: number
        pending:
          type: number
        verified:
          type: number
        qualified:
          type: number
        rewarded:
          type: number
        rejected:
          type: number

    ReferralListResponse:
      type: object
      properties:
        stats:
          $ref: "#/components/schemas/ReferralStats"
        referrals:
          type: array
          items:
            $ref: "#/components/schemas/Referral"

    # ── AI Usage ──────────────────────────────────────────────────────────────
    AIUsageLog:
      type: object
      required: [id, userId, model, provider, inputTokens, outputTokens, estimatedCostUsd, costCents, requestType, createdAt]
      properties:
        id:
          type: number
        userId:
          type: string
        projectId:
          type: ["number", "null"]
        tierId:
          type: ["string", "null"]
          example: "free"
        model:
          type: string
          example: "llama-3.1-8b-instant"
        provider:
          type: string
