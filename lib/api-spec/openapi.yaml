openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI Academic Workspace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: projects
    description: Project management
  - name: messages
    description: AI chat per project
  - name: documents
    description: Document versions
  - name: references
    description: Academic references
  - name: attachments
    description: File attachments
  - name: activities
    description: Activity timeline
  - name: jobs
    description: AI job queue
  - name: exports
    description: Document exports
  - name: metadata
    description: Project metadata
  - name: ai-usage
    description: AI usage tracking (FinOps)
paths:
  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange Supabase token for server session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid token

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out and clear session
      responses:
        "200":
          description: Logged out

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      responses:
        "200":
          description: Token refreshed
        "401":
          description: Session expired

  /auth/referrals:
    get:
      operationId: getReferrals
      tags: [auth]
      summary: Get referral stats and list for current user
      responses:
        "200":
          description: Referral stats and list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralListResponse"
        "401":
          description: Unauthorized

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Projects ──────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/stats:
    get:
      operationId: getProjectStats
      tags: [projects]
      summary: Dashboard summary stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/analyze:
    post:
      operationId: analyzeProject
      tags: [projects]
      summary: Trigger full AI analysis pipeline for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "202":
          description: Analysis started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  # ── Messages (per-project chat) ───────────────────────────────────────────
  /projects/{projectId}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: Get chat history for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message and get AI response
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: AI response message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  # ── Documents ─────────────────────────────────────────────────────────────
  /projects/{projectId}/documents:
    get:
      operationId: listDocumentVersions
      tags: [documents]
      summary: List all document versions for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Document versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentVersion"

  /projects/{projectId}/documents/latest:
    get:
      operationId: getLatestDocument
      tags: [documents]
      summary: Get the latest document version
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Latest document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVersion"
        "404":
          description: No document yet

  /projects/{projectId}/outline:
    post:
      operationId: regenerateOutline
      tags: [documents]
      summary: Regenerate document outline
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userOutline:
                  type: string
                  description: Optional user-modified outline to refine
      responses:
        "200":
          description: New outline
          content:
            application/json:
              schema:
                type: object
                properties:
                  outline:
                    type: string

  /projects/{projectId}/documents/generate:
    post:
      operationId: generateDocument
      tags: [documents]
      summary: Generate a new document from the current outline
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "202":
          description: Document generation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: number
                  status:
                    type: string

  # ── References ────────────────────────────────────────────────────────────
  /projects/{projectId}/references:
    get:
      operationId: listReferences
      tags: [references]
      summary: List all references for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: References
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reference"
    post:
      operationId: createReference
      tags: [references]
      summary: Add a reference manually
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceInput"
      responses:
        "201":
          description: Created reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reference"

  /projects/{projectId}/references/{referenceId}:
    delete:
      operationId: deleteReference
      tags: [references]
      summary: Delete a reference
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: referenceId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/references/regenerate:
    post:
      operationId: regenerateBibliography
      tags: [references]
      summary: Regenerate bibliography for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated bibliography text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BibliographyResult"

  /projects/{projectId}/references/validate:
    post:
      operationId: validateReferences
      tags: [references]
      summary: Validate all references against the citation format
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Validation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceValidationResult"

  /projects/{projectId}/references/format:
    post:
      operationId: formatCSLBibliography
      tags: [references]
      summary: Format references as a CSL-formatted bibliography
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [APA, APA7, IEEE, Vancouver, Chicago, MLA, Harvard]
      responses:
        "200":
          description: Formatted bibliography text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BibliographyResult"

  /references/fetch-metadata:
    post:
      operationId: fetchReferenceMetadata
      tags: [references]
      summary: Fetch reference metadata by DOI or ISBN
      description: Accepts a DOI or ISBN identifier and fetches metadata from CrossRef or Open Library.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchReferenceMetadataRequest"
      responses:
        "200":
          description: Fetched metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchedReferenceMetadata"
        "400":
          description: Unsupported or invalid identifier
        "404":
          description: Metadata not found
        "502":
          description: External API unavailable

  /projects/{projectId}/share:
    get:
      operationId: listShareLinks
      tags: [projects]
      summary: List all share links for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Share links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShareLink"
        "401":
          description: Unauthorized
    post:
      operationId: createShareLink
      tags: [projects]
      summary: Create a share link for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareLinkRequest"
      responses:
        "201":
          description: Share link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLink"
        "401":
          description: Unauthorized

  /projects/{projectId}/share/{shareId}:
    delete:
      operationId: deleteShareLink
      tags: [projects]
      summary: Revoke a share link
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: shareId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Share link revoked
        "401":
          description: Unauthorized
        "404":
          description: Share link not found

  /shared/{token}:
    get:
      operationId: accessSharedProject
      tags: [projects]
      summary: Access a shared project via token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared project data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedProject"
        "404":
          description: Invalid or expired share link

  # ── Attachments ───────────────────────────────────────────────────────────
  /projects/{projectId}/attachments:
    get:
      operationId: listAttachments
      tags: [attachments]
      summary: List attachments for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"
    post:
      operationId: uploadAttachment
      tags: [attachments]
      summary: Upload an attachment as base64 JSON
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentUpload"
      responses:
        "201":
          description: Uploaded attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"

  /projects/{projectId}/attachments/{attachmentId}:
    delete:
      operationId: deleteAttachment
      tags: [attachments]
      summary: Delete an attachment
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: attachmentId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ── Activities ────────────────────────────────────────────────────────────
  /projects/{projectId}/activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: Get activity timeline for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"

  # ── Jobs ──────────────────────────────────────────────────────────────────
  /projects/{projectId}/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List AI jobs for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  # ── Metadata ──────────────────────────────────────────────────────────────
  /projects/{projectId}/metadata:
    get:
      operationId: getProjectMetadata
      tags: [metadata]
      summary: Get analyzed metadata for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMetadata"
        "404":
          description: No metadata yet

  # ── AI Usage (FinOps) ───────────────────────────────────────────────────
  /ai-usage:
    get:
      operationId: listAIUsage
      tags: [ai-usage]
      summary: List AI usage records
      parameters:
        - name: userId
          in: query
          schema:
            type: string
          description: Filter by user (admin only, defaults to current user)
        - name: projectId
          in: query
          schema:
            type: number
          description: Filter by project
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: number
            default: 50
        - name: offset
          in: query
          schema:
            type: number
            default: 0
      responses:
        "200":
          description: AI usage records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AIUsageLog"
                  total:
                    type: number
        "401":
          description: Unauthorized

  /ai-usage/stats:
    get:
      operationId: getAIUsageStats
      tags: [ai-usage]
      summary: Get aggregated AI usage statistics
      parameters:
        - name: userId
          in: query
          schema:
            type: string
          description: Filter by user (admin only, defaults to current user)
        - name: projectId
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Aggregated usage stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIUsageStats"
        "401":
          description: Unauthorized

  # ── Exports ───────────────────────────────────────────────────────────────
  /projects/{projectId}/exports:
    get:
      operationId: listExports
      tags: [exports]
      summary: List exports for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Exports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Export"
    post:
      operationId: createExport
      tags: [exports]
      summary: Create a new export
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportInput"
      responses:
        "201":
          description: Created export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"

components:
  schemas:
    # ── Auth ─────────────────────────────────────────────────────────────────
    AuthUser:
      type: object
      required: [id, email, isOwner, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        isOwner:
          type: boolean
        referralCode:
          type: ["string", "null"]
          description: Unique referral code this user can share
        createdAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          pattern: "^[^@]+@[^@]+\\.[^@]+$"
        password:
          type: string
          minLength: 6
        displayName:
          type: string
        referralCode:
          type: string
          description: Optional referral code used during registration

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Project ──────────────────────────────────────────────────────────────
    Project:
      type: object
      required: [id, title, status, progress, createdAt, updatedAt]
      properties:
        id:
          type: number
        title:
          type: string
        status:
          type: string
          enum: [draft, analyzing, writing, waiting_revision, completed, archived]
        progress:
          type: number
          description: 0-100 percent
        instructionText:
          type: ["string", "null"]
        subject:
          type: ["string", "null"]
        taskType:
          type: ["string", "null"]
        citationFormat:
          type: ["string", "null"]
        outputFormat:
          type: ["string", "null"]
        minRefYear:
          type: ["number", "null"]
        minRefCount:
          type: ["number", "null"]
        aiDisclosure:
          type: boolean
          description: Toggle AI disclosure labels (default true)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        instructionText:
          type: string
        outputFormat:
          type: string
          enum: [docx, pdf, markdown]
        minRefYear:
          type: number
        minRefCount:
          type: number
        aiDisclosure:
          type: boolean

    ProjectUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        status:
          type: string
          enum: [draft, analyzing, writing, waiting_revision, completed, archived]
        instructionText:
          type: string
        outputFormat:
          type: string
          enum: [docx, pdf, markdown]
        minRefYear:
          type: number
        minRefCount:
          type: number
        progress:
          type: number
        aiDisclosure:
          type: boolean

    ProjectStats:
      type: object
      required: [total, byStatus, recentActivity]
      properties:
        total:
          type: number
        byStatus:
          type: object
          additionalProperties:
            type: number
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"

    # ── Message ───────────────────────────────────────────────────────────────
    Message:
      type: object
      required: [id, projectId, role, content, createdAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    ChatMode:
      type: string
      enum: [generate, revise, reflect, socratic, quiz, summary]
      description: AI writing assistant mode

    MessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
        mode:
          $ref: "#/components/schemas/ChatMode"
          default: revise

    # ── DocumentVersion ───────────────────────────────────────────────────────
    DocumentVersion:
      type: object
      required: [id, projectId, versionNumber, content, createdAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        versionNumber:
          type: number
        content:
          type: string
        outline:
          type: ["string", "null"]
        changeDescription:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ── Reference ─────────────────────────────────────────────────────────────
    Reference:
      type: object
      required: [id, projectId, title, validationStatus, createdAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        title:
          type: string
        authors:
          type: ["string", "null"]
        year:
          type: ["number", "null"]
        journal:
          type: ["string", "null"]
        volume:
          type: ["string", "null"]
        issue:
          type: ["string", "null"]
        doi:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        validationStatus:
          type: string
          enum: [unverified, verified, invalid]
        usedInChapters:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ReferenceInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        authors:
          type: string
        year:
          type: number
        journal:
          type: string
        volume:
          type: string
        issue:
          type: string
        doi:
          type: string
        url:
          type: string

    BibliographyResult:
      type: object
      required: [bibliography]
      properties:
        bibliography:
          type: string
        format:
          type: string

    ValidationIssue:
      type: object
      required: [severity, message, field]
      properties:
        severity:
          type: string
          enum: [error, warning]
        message:
          type: string
        field:
          type: string

    ReferenceValidation:
      type: object
      required: [id, title, validation]
      properties:
        id:
          type: number
        title:
          type: string
        validation:
          type: object
          properties:
            valid:
              type: boolean
            issues:
              type: array
              items:
                $ref: "#/components/schemas/ValidationIssue"

    ReferenceValidationResult:
      type: object
      required: [format, totalReferences, results]
      properties:
        format:
          type: string
        totalReferences:
          type: number
        totalErrors:
          type: number
        totalWarnings:
          type: number
        results:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceValidation"

    # ── Attachment ────────────────────────────────────────────────────────────
    Attachment:
      type: object
      required: [id, projectId, filename, attachmentType, createdAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        filename:
          type: string
        originalName:
          type: string
        mimeType:
          type: ["string", "null"]
        sizeBytes:
          type: ["number", "null"]
        attachmentType:
          type: string
          enum: [instruction, supplement]
        extractedText:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    AttachmentUpload:
      type: object
      required: [filename, base64Content, attachmentType]
      properties:
        filename:
          type: string
        base64Content:
          type: string
        mimeType:
          type: string
        attachmentType:
          type: string
          enum: [instruction, supplement]

    # ── Activity ──────────────────────────────────────────────────────────────
    Activity:
      type: object
      required: [id, projectId, eventType, description, createdAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        eventType:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    # ── Job ───────────────────────────────────────────────────────────────────
    Job:
      type: object
      required: [id, projectId, jobType, status, createdAt, updatedAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        jobType:
          type: string
          enum: [analyze, outline, references, write_chapter, citations, bibliography, export]
        status:
          type: string
          enum: [pending, running, completed, failed]
        result:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── ProjectMetadata ───────────────────────────────────────────────────────
    ProjectMetadata:
      type: object
      required: [id, projectId, createdAt, updatedAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        detectedTitle:
          type: ["string", "null"]
        subject:
          type: ["string", "null"]
        taskType:
          type: ["string", "null"]
        citationFormat:
          type: ["string", "null"]
        language:
          type: ["string", "null"]
        outline:
          type: ["string", "null"]
        contextSummary:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Export ────────────────────────────────────────────────────────────────
    Export:
      type: object
      required: [id, projectId, format, status, createdAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        format:
          type: string
          enum: [docx, pdf, markdown]
        status:
          type: string
          enum: [pending, completed, failed]
        filePath:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ExportInput:
      type: object
      required: [format]
      properties:
        format:
          type: string
          enum: [docx, pdf, markdown]
        documentVersionId:
          type: number

    # ── Referral ──────────────────────────────────────────────────────────────
    Referral:
      type: object
      required: [id, referrerId, referredId, referralCode, status, createdAt]
      properties:
        id:
          type: number
        referrerId:
          type: string
        referredId:
          type: string
        referredEmail:
          type: string
        referralCode:
          type: string
        status:
          type: string
          enum: [pending, verified, qualified, rewarded, rejected]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReferralEvent:
      type: object
      required: [id, referralId, actorType, toStatus, createdAt]
      properties:
        id:
          type: number
        referralId:
          type: number
        actorId:
          type: ["string", "null"]
        actorType:
          type: string
          enum: [system, user, admin]
        fromStatus:
          type: ["string", "null"]
        toStatus:
          type: string
        reason:
          type: ["string", "null"]
        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time

    ReferralStats:
      type: object
      properties:
        total:
          type: number
        pending:
          type: number
        verified:
          type: number
        qualified:
          type: number
        rewarded:
          type: number
        rejected:
          type: number

    ReferralListResponse:
      type: object
      properties:
        stats:
          $ref: "#/components/schemas/ReferralStats"
        referrals:
          type: array
          items:
            $ref: "#/components/schemas/Referral"

    # ── AI Usage ──────────────────────────────────────────────────────────────
    AIUsageLog:
      type: object
      required: [id, userId, model, provider, inputTokens, outputTokens, estimatedCostUsd, requestType, createdAt]
      properties:
        id:
          type: number
        userId:
          type: string
        projectId:
          type: ["number", "null"]
        model:
          type: string
          example: "claude-sonnet-4-20250514"
        provider:
          type: string
          example: "anthropic"
        inputTokens:
          type: number
        outputTokens:
          type: number
        estimatedCostUsd:
          type: number
        requestType:
          type: string
          enum: [chat, analyze, outline, write, export, bibliography]
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time

    AIUsageStats:
      type: object
      required: [totalRequests, totalInputTokens, totalOutputTokens, totalCostUsd, byRequestType]
      properties:
        totalRequests:
          type: number
        totalInputTokens:
          type: number
        totalOutputTokens:
          type: number
        totalCostUsd:
          type: number
        byRequestType:
          type: object
          additionalProperties:
            type: object
            properties:
              requests:
                type: number
              inputTokens:
                type: number
              outputTokens:
                type: number
              costUsd:
                type: number

    # ── Share Link ────────────────────────────────────────────────────────────
    FetchReferenceMetadataRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          description: DOI (e.g. 10.1000/xyz123) or ISBN-10/ISBN-13

    FetchedReferenceMetadata:
      type: object
      required: [title, source]
      properties:
        title:
          type: string
        authors:
          type: ["string", "null"]
        year:
          type: ["number", "null"]
        journal:
          type: ["string", "null"]
        volume:
          type: ["string", "null"]
        issue:
          type: ["string", "null"]
        doi:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        publisher:
          type: ["string", "null"]
        source:
          type: string
          enum: [crossref, openlibrary, manual]

    ShareLink:
      type: object
      required: [id, projectId, token, accessMode, createdAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        token:
          type: string
          description: Unique share token
        accessMode:
          type: string
          enum: [view, comment, edit]
        label:
          type: ["string", "null"]
          description: Optional label/nickname for this share link
        expiresAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    CreateShareLinkRequest:
      type: object
      required: [accessMode]
      properties:
        accessMode:
          type: string
          enum: [view, comment, edit]
        label:
          type: string
        expiresInDays:
          type: number
          description: Days until link expires (optional, null = never)

    SharedProject:
      type: object
      required: [id, title, status, accessMode, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        status:
          type: string
          enum: [draft, analyzing, writing, waiting_revision, completed, archived]
        subject:
          type: ["string", "null"]
        taskType:
          type: ["string", "null"]
        latestDocument:
          type: ["string", "null"]
          description: Latest document content (if accessMode is view or edit)
        accessMode:
          type: string
          enum: [view, comment, edit]
        ownerEmail:
          type: string
          description: Owner email (for display purposes only)
        createdAt:
          type: string
          format: date-time

