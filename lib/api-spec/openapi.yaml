                $ref: "#/components/schemas/Rubric"
        "404":
          description: Rubric not found
    post:
      operationId: generateRubric
      tags: [quizzes]
      summary: Generate AI rubric for a quiz
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: quizId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                manualNotes:
                  type: string
